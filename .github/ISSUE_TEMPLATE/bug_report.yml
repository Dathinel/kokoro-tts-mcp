name: Bug report
description: Something broke. Tell us what, where, and how.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a bug.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the exact error message and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `...`
        2. See error
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Node version, Python version, and how you installed the package.
    validations:
      required: true
